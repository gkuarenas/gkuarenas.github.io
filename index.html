<template data-window="projects/gripvt" data-title="GripVT" data-size="540x460">
  <h2 class="rt-h1">GripVT</h2>
  <p class="rt-note">Master's thesis, May 2026 – present. Under review at IEEE Sensors Journal.</p>
  <p>A wearable, camera-based sensor that estimates hand grip force from how a silicone skin deforms on the forearm.</p>
  <figure class="rt-fig"><img src="images/gripvt.png" alt="GripVT sensor" loading="lazy"><figcaption>The GripVT sensor</figcaption></figure>
  <h3 class="rt-h2 rt-sec">Problem</h3>
  <p>Grip strength is a standard clinical measure, but no non-invasive method captures the forearm deformation that produces it. Dynamometers give one force number, EMG needs careful setup and drifts with fatigue, and pressure gloves restrict motion. Visuotactile sensing works for object contact, but had not been tested on human skin driven by muscle.</p>
  <h3 class="rt-h2 rt-sec">Method</h3>
  <ul>
    <li>Mold a soft silicone skin with a 99-marker grid and wear it over the forearm.</li>
    <li>Track marker displacement with a camera as the wearer grips (Kalman filter and Hungarian assignment).</li>
    <li>Predict grip force with Ridge, XGBoost, and MLP models, compared with leakage-safe nested cross-validation (Optuna, MLflow).</li>
    <li>Built the data-collection app in Python (CustomTkinter): calibration, live camera feed, and de-identified, crash-safe session storage. 379 tests across 21 files (pytest).</li>
  </ul>
  <figure class="rt-fig"><img src="images/figure-abstract.png" alt="GripVT graphical abstract: hardware, marker-displacement tracking, and the XGBoost pipeline producing grip-force estimates" loading="lazy"><figcaption>Graphical abstract: hardware, marker tracking, and the model pipeline</figcaption></figure>
  <figure class="rt-fig"><img src="images/gripvt-exploded.png" alt="Exploded view of the GripVT sensor" loading="lazy"><figcaption>Exploded view</figcaption></figure>
  <figure class="rt-fig"><img src="images/software.png" alt="GripVT data collection software" loading="lazy"><figcaption>Data collection software</figcaption></figure>
  <figure class="rt-fig"><img src="images/gripvt-forearm.jpg" alt="GripVT worn on the forearm" loading="lazy"><figcaption>Worn on the forearm</figcaption></figure>
  <figure class="rt-fig"><img src="images/Figure-4.23.png" alt="Marker detection: raw grid vs. tracked markers" loading="lazy"><figcaption>Marker detection: raw grid and tracked markers</figcaption></figure>
  <h3 class="rt-h2 rt-sec">Result</h3>
  <p>Grip force predicted to within ~6% of a wearer's maximum strength for returning wearers and ~9% for new wearers, on 98 sessions from 10 participants.</p>
  <p class="rt-tools">TOOLS: Python, OpenCV, scikit-learn</p>
  <div class="rt-links">
    <a class="rt-btn out" href="https://github.com/gkuarenas/GripVT" target="_blank" rel="noopener">GitHub repo</a>
    <button type="button" class="rt-btn out" data-open="manuscript">Request the manuscript</button>
  </div>
</template>
<template data-window="projects/testing-rig" data-title="Testing Rig" data-size="540x460">
  <h2 class="rt-h1">Testing Rig</h2>
  <p class="rt-note">May – Jun 2026. Accepted at VTCA 2026.</p>
  <p>A low-cost automated test bench for characterizing soft sensor materials.</p>
  <figure class="rt-fig"><img src="images/ender-3-rig.png" alt="Full testing rig, labeled" loading="lazy"><figcaption>The full rig, labeled</figcaption></figure>
  <h3 class="rt-h2 rt-sec">Problem</h3>
  <p>Published protocols for visuotactile sensors use industrial robotic arms that cost $10,000 – $14,000 per rig. The manual fallback, a force gauge, takes an estimated 25 hours per specimen because there is no automated depth control or synchronized force and position logging.</p>
  <h3 class="rt-h2 rt-sec">Method</h3>
  <ul>
    <li>Retrofit an Ender 3 3D printer with a load cell and a camera (about $250 total).</li>
    <li>Track 150+ markers per frame at ~30 FPS with OpenCV, Kalman filtering, and Hungarian assignment.</li>
    <li>Run calibration, testing, and logging unattended: self-calibrating depth search, safety interlocks, and crash-safe resumable sessions.</li>
    <li>Compare 4 silicone elastomer blends with one-way ANOVA and Tukey HSD.</li>
  </ul>
  <figure class="rt-fig"><img src="images/testing-rig-screenshot.jpg" alt="Indentation close-up" loading="lazy"><figcaption>Indentation close-up</figcaption></figure>
  <figure class="rt-fig"><img src="images/software-low-cost-testing-rig.png" alt="Testing rig control software" loading="lazy"><figcaption>Control software</figcaption></figure>
  <figure class="rt-fig"><img src="images/testing-rig-sensitivity-results.png" alt="Sensitivity results" loading="lazy"><figcaption>Sensitivity results</figcaption></figure>
  <figure class="rt-fig"><img src="images/v2-hysteresis-loops-multispeed.svg" alt="Hysteresis loops at several speeds" loading="lazy"><figcaption>Hysteresis loops</figcaption></figure>
  <h3 class="rt-h2 rt-sec">Result</h3>
  <ul>
    <li>About 98% cheaper than the $10,000 – $14,000 commercial systems.</li>
    <li>About 90% less time, roughly 10x faster than the manual method.</li>
    <li>1.6M+ structured measurements per run.</li>
    <li>One blend came out statistically dominant (p&lt;0.001), which gave a data-driven material recommendation.</li>
  </ul>
  <p class="rt-tools">TOOLS: Python, OpenCV, SciPy, Pandas, G-code</p>
  <div class="rt-links">
    <a class="rt-btn out" href="https://github.com/gkuarenas/visuotactile-eval" target="_blank" rel="noopener">GitHub repo</a>
  </div>
</template>

<template data-window="projects/pcb-defect-detection" data-title="PCB Defects" data-size="540x460">
  <h2 class="rt-h1">PCB Defects</h2>
  <p class="rt-note">Oct – Dec 2023. Published, IEEE TENCON 2024.</p>
  <p>A YOLOv8-based defect detector for printed circuit boards, sped up with TensorRT. I was first author and student team lead: dataset preparation, augmentation, training, testing, evaluation, and writing.</p>
  <figure class="rt-fig"><img src="images/pcb-defect-samples.png" alt="Six defect types: missing hole, mouse bite, open circuit, short, spur, spurious copper" loading="lazy"><figcaption>Six defect types: missing hole, mouse bite, open circuit, short, spur, spurious copper</figcaption></figure>
  <h3 class="rt-h2 rt-sec">Problem</h3>
  <p>Manual visual inspection of PCBs is slow and inconsistent, and it does not scale with production volume. Template-based automated inspection needs a stored reference per board design and breaks down when lighting or alignment changes. Both struggle with small, varied defects.</p>
  <h3 class="rt-h2 rt-sec">Method</h3>
  <ul>
    <li>Build an augmented training set covering six defect types.</li>
    <li>Train a YOLOv8s detector on it.</li>
    <li>Convert the trained model to TensorRT so it runs fast enough for real-time inspection.</li>
  </ul>
  <h3 class="rt-h2 rt-sec">Result</h3>
  <div class="rt-table-wrap"><table class="rt-table">
    <thead><tr><th>Model</th><th>mAP50</th><th>Inference</th><th>Size</th></tr></thead>
    <tbody>
      <tr><td>YOLOv8s</td><td>98.6%</td><td>7.6 ms</td><td>87.5 MB</td></tr>
      <tr><td>YOLOv8s + TensorRT</td><td>98.5%</td><td>6.7 ms</td><td>53.1 MB</td></tr>
    </tbody>
  </table></div>
  <p>TensorRT lost only 0.1% mAP50, cut inference time by about 0.9 ms, and shrank the model by about 39.3%.</p>
  <p class="rt-tools">TOOLS: Python, YOLOv8, TensorRT, Roboflow, OpenCV</p>
  <div class="rt-links">
    <a class="rt-btn out" href="https://doi.org/10.1109/TENCON61640.2024.10902913" target="_blank" rel="noopener">View paper</a>

<template data-window="projects/marker-tracking-pipeline" data-title="Marker Tracking" data-size="540x460">
  <h2 class="rt-h1">Marker Tracking</h2>
  <p class="rt-note">Part of GripVT. Graduate research at NCUT, under my master's thesis.</p>
  <p>A sub-pixel marker detection and tracking pipeline for a 9×11, 99-marker visuotactile sensor array.</p>
  <figure class="rt-fig"><img src="images/marker-tracking-demo.gif" alt="Live detector calibration view tracking all 99 markers in real time" loading="lazy"><figcaption>Live calibration view tracking all 99 markers</figcaption></figure>
  <h3 class="rt-h2 rt-sec">Problem</h3>
  <p>GripVT reads grip force from how the marker band deforms. The pipeline must find each of the 99 markers' position and size in every frame, precisely enough to catch a small muscle bulge at a light grip. The band is worn and removed between sessions, so lighting and marker position shift each time.</p>
  <h3 class="rt-h2 rt-sec">Method</h3>
  <ul>
    <li>Undistort and rotate each frame, then crop, denoise, flatten illumination, and binarize to isolate candidate marker blobs.</li>
    <li>Fit a closed-form 2D Gaussian to each blob (Caruana log-parabola method) for a sub-pixel center and size, with no threshold to tune. Fall back to the blob centroid and area when a fit is invalid.</li>
    <li>Lock each marker's identity and start position from a 15-frame median baseline.</li>
    <li>Track every marker frame to frame with a Kalman filter and gated Hungarian assignment. The gate can reject a match, so a missing or stray detection does not corrupt a neighbor.</li>
  </ul>
  <figure class="rt-fig"><img src="images/marker-pipeline-diagram.png" alt="Pipeline stages: input frame, undistortion, preprocessing, detection, identity assignment, and displacement output" loading="lazy"><figcaption>Pipeline stages</figcaption></figure>
  <figure class="rt-fig"><img src="images/Figure-4.25.png" alt="All 99 markers detected across relaxed, full open, and max grip states" loading="lazy"><figcaption>All 99 markers detected in relaxed, full open, and max grip states</figcaption></figure>
  <h3 class="rt-h2 rt-sec">Result</h3>
  <ul>
    <li>Throughput raised from 12.9 to 26.7 fps.</li>
    <li>Sub-pixel position and threshold-free size for all 99 markers in every frame.</li>
    <li>Used on real GripVT sessions, where detector self-calibration passed on the first attempt.</li>
  </ul>
  <p class="rt-tools">TOOLS: Python, OpenCV, NumPy, SciPy</p>
  <div class="rt-links">
    <a class="rt-btn out" href="https://github.com/gkuarenas/GripVT" target="_blank" rel="noopener">GitHub repo</a>
  </div>
</template>
<template data-window="projects/mechanoluminescent-elastomer" data-title="Sensing Skin" data-size="540x460">
  <h2 class="rt-h1">Sensing Skin</h2>
  <p class="rt-note">Published, IEEE ICCT-Pacific 2026. Mechanoluminescent sensing skin.</p>
  <p>A light-emitting silicone lattice for visuotactile sensing. I designed the camera module that reads the skin and built the software that extracts its emission signals. The skin itself was designed by the co-author team, credited in the paper.</p>
  <figure class="rt-fig"><img src="images/mechano-sensing-skin.jpeg" alt="Fabricated mechanoluminescent lattice skin" loading="lazy"><figcaption>Fabricated lattice skin</figcaption></figure>
  <h3 class="rt-h2 rt-sec">Problem</h3>
  <p>Camera-based visuotactile sensors usually need dedicated lighting or careful optical calibration to read a soft skin's deformation. That adds parts and assembly steps, and it drifts over time from wear or misalignment.</p>
  <h3 class="rt-h2 rt-sec">Method</h3>
  <ul>
    <li>The team molds a 30 × 30 mm silicone lattice embedded with ZnS:Cu,Al phosphor. It emits light where it deforms, so it needs no external light.</li>
    <li>A black-housing camera module holds the lattice on an acrylic window and records it.</li>
    <li>Python and OpenCV extract intensity-time signals for two contact modes: normal pressing and shear sliding.</li>
  </ul>
  <figure class="rt-fig"><img src="images/mechano-camera-fixture.png" alt="Black-housing camera fixture that reads the sensing skin" loading="lazy"><figcaption>Black-housing camera fixture</figcaption></figure>
  <figure class="rt-fig"><img src="images/mechano-emission-pressing.png" alt="Localized green emission spots on the lattice during normal pressing" loading="lazy"><figcaption>Pressing: localized emission spots</figcaption></figure>
  <figure class="rt-fig"><img src="images/mechano-emission-shear.png" alt="Elongated green emission streak on the lattice during shear sliding" loading="lazy"><figcaption>Shear sliding: elongated emission streak</figcaption></figure>
  <h3 class="rt-h2 rt-sec">Result</h3>
  <ul>
    <li>Pressing and shear gave visibly different emission shapes, confirmed by the extracted intensity-time signals.</li>
    <li>The lattice told the two contact modes apart with no active lighting and no printed markers.</li>
    <li>This is a preliminary, qualitative study. Contact forces were applied by hand and not measured.</li>
  </ul>
  <p class="rt-tools">TOOLS: Python, OpenCV, signal processing, image processing</p>
  <div class="rt-links">
    <a class="rt-btn out" href="https://doi.org/10.1109/ICCT-Pacific69083.2026.11519013" target="_blank" rel="noopener">View paper</a>
    <a class="rt-btn out" href="https://github.com/gkuarenas/mechanoluminescence-intensity" target="_blank" rel="noopener">GitHub repo</a>
  </div>
</template>
<template data-window="projects/carton-sorting" data-title="Carton Sorting" data-size="540x460">
  <h2 class="rt-h1">Carton Sorting</h2>
  <p class="rt-note">Apr 2025.</p>
  <p>A camera-and-conveyor prototype that detects and sorts defective packaging cartons in real time with a YOLO11n model.</p>
  <figure class="rt-fig"><img src="images/carton-final-prototype.jpg" alt="Final cardboard-and-acrylic conveyor prototype with camera mount" loading="lazy"><figcaption>Cardboard-and-acrylic conveyor prototype with camera mount</figcaption></figure>
  <h3 class="rt-h2 rt-sec">Problem</h3>
  <p>Packaging lines need to catch defective cartons (open, torn, or holed) before they ship. Manual inspection does not scale on a fast line.</p>
  <h3 class="rt-h2 rt-sec">Method</h3>
  <ul>
    <li>Conveyor on a 12V DC motor, an ESP32-CAM for video, an Arduino Uno for control, and a servo and LED for sorting and signaling.</li>
    <li>170 labeled images across four box conditions (sealed, open, torn, holed), split 70/20/10 and augmented to 510 images.</li>
    <li>YOLO11n trained on that set. During live inference, a defect call inside the detection zone sends a serial command to the Arduino, which moves the servo and lights the LED.</li>
  </ul>
  <figure class="rt-fig"><img src="images/carton-hole-detection.png" alt="Live detection with a bounding box drawn around a carton with a hole" loading="lazy"><figcaption>Live detection of a carton with a hole</figcaption></figure>
  <figure class="rt-fig"><img src="images/carton-sorting-in-action.png" alt="Blue LED lit on the prototype, signaling a defect call during sorting" loading="lazy"><figcaption>Blue LED lit after a defect call</figcaption></figure>
  <figure class="rt-fig"><img src="images/carton-confusion-matrix.png" alt="Confusion matrix of the YOLO11n model across box, hole, open, sealed, and torn classes" loading="lazy"><figcaption>Confusion matrix</figcaption></figure>
  <h3 class="rt-h2 rt-sec">Result</h3>
  <ul>
    <li>0.872 precision, 0.948 recall, mAP50 of 0.970 (97.0%), and mAP50-95 of 0.796 across the four classes.</li>
    <li>Defective boxes were caught and sorted correctly in testing, at about 6 seconds per box end to end. Most of that is a deliberate 5-second LED hold, not model speed.</li>
    <li>Open boxes were the hardest class. The cardboard frame caused occasional servo stalling.</li>
  </ul>
  <p class="rt-tools">TOOLS: Python, YOLO11n, OpenCV, Arduino, ESP32-CAM</p>
  <div class="rt-links">
    <a class="rt-btn out" href="https://github.com/gkuarenas/package-defect-sorter-yolo11" target="_blank" rel="noopener">GitHub repo</a>
  </div>
</template>
